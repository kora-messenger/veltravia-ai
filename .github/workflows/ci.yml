name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: Lint workflow files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # GitHub rejects the whole file when an expression is invalid - the APK run
      # once started zero jobs for exactly that reason. This checks the syntax and
      # the context rules before a real run can be lost to it.
      - name: actionlint
        uses: raven-actions/actionlint@v2

  verify:
    name: Lint, test & build
    runs-on: ubuntu-latest
    # A real PostgreSQL 16 for the storage integration tests. Without a service
    # those tests skip, and a skip must never be how CI passes.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: veltravia
          POSTGRES_PASSWORD: veltravia
          POSTGRES_DB: veltravia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veltravia -d veltravia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VELTRAVIA_TEST_DATABASE_URL: postgres://veltravia:veltravia@127.0.0.1:5432/veltravia_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
